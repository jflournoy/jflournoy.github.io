project:
  type: website
  # Flournoy.bib is regenerated by Zotero on every citation add, so the
  # stripped public copy has to be rebuilt on every render or it silently
  # goes stale.
  pre-render:
    - ./make-public-bib.sh
    # Incremental and fail-soft: no network calls unless the bibliography
    # gained an entry, and never fails the build.
    - ./fetch-oa-links.sh
  render:
    - "*.qmd"
    # Internal notes, not site pages. They contain local filesystem paths and
    # would otherwise be published (and indexed in the site search).
    - "!CLAUDE.md"
    - "!tracking-implementation-plan.md"
    - "!README.md"
  resources:
    # BibTeX download for the publications page. This is the stripped copy
    # produced by make-public-bib.sh — NOT Flournoy.bib, which contains local
    # Zotero paths and publisher abstracts.
    - flournoy-publications.bib

website:
  title: "science is a verb"
  favicon: 'favicon.png'
  navbar:
    background: dark
    right:
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app/profile/johnflournoy.science
      - text: "{{< fa brands github >}}"
        href: https://www.github.com/jflournoy
      - text: "{{< fa brands linkedin >}}"
        href: https://www.linkedin.com/in/johnflournoy/
    search: true
    left:
      - href: index.qmd
        text: Home
      - text: "{{< fa solid dice >}} Playground"
        href: projects.qmd
      - resume.qmd
      - text: "{{< fa regular lightbulb >}} Consulting"
        href: consulting.qmd
      - pubs.qmd
      # - href: cv_page.qmd
      #   text: CV
      - href: lol.qmd
        text: Links
  page-footer: 
    background: none
    right: "{{< fa brands creative-commons >}} {{< fa brands creative-commons-by >}} <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a>"
    left: |
          <!-- 100% privacy-first analytics -->
          <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  
format:
